/* Visual refinement: restrained chrome, generous previews, progressive disclosure. */
body{background:color-mix(in srgb,var(--soft) 78%,var(--border));}
.frame{width:min(980px,calc(100% - 72px));height:min(820px,calc(100dvh - 48px));margin:24px auto;}
.body-rim{padding:1px;border-radius:22px;box-shadow:0 22px 60px #23162b12,0 2px 5px #23162b08;}
.app{border-radius:21px;}
.robot-head{width:46px;height:28px;left:calc(50% - 23px);top:5px;}
.robot-head .eye{top:10px;height:5px;}
.robot-head .smile{bottom:7px;}
.hands:before,.hands:after{width:6px;height:22px;border-width:1.5px;}
.headbar{padding:16px 24px 10px;gap:10px;min-height:58px;}
.wordmark{font-size:21px;letter-spacing:-.04em;gap:7px;}
.wordmark img{width:23px;height:28px;}
.autostate{border:0;padding:4px 6px;font-size:11px;}
.search-trigger{width:148px;background:var(--soft);border:0;min-height:32px;}
.headbar>.icon-btn{color:var(--muted);width:30px;height:30px;}
.primary-nav{padding:0 24px;gap:24px;min-height:48px;align-items:stretch;}
.primary-nav a{position:relative;padding:11px 0 14px;border-radius:0;font-size:12px;gap:7px;}
.primary-nav a.active{color:var(--fg);background:transparent;}
.primary-nav a.active:after{content:'';position:absolute;bottom:-1px;height:2px;left:0;right:0;background:var(--accent);border-radius:2px;}
.primary-nav a:hover{background:transparent;color:var(--fg);}
.primary-nav a svg{width:16px;height:16px;}
.main{padding:28px;}
.page-head{margin-bottom:22px;align-items:center;}
.page-head h1{font-size:28px;letter-spacing:-.035em;font-weight:600;}
.page-title-row{gap:11px;}
.count{font-size:11px;padding:3px 7px;min-width:23px;text-align:center;border-radius:7px;background:var(--soft);}
.project-select{font-size:12px;max-width:190px;border-color:var(--border)!important;background:var(--surface);border-radius:8px;padding:8px 28px 8px 11px;}
.composer{display:flex;align-items:center;gap:4px;padding:4px 6px 4px 0;border:1px solid var(--border);border-radius:13px;}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 9%,transparent);}
.composer textarea{padding:13px 16px;min-height:46px;height:46px;flex:1;line-height:1.5;font-size:14px;}
.composer .row{padding:0;gap:7px;}
.composer .icon-btn{color:var(--muted);}
.composer .btn{min-height:34px;padding:7px 12px;}
.capture-shortcut{font-size:11px;color:var(--muted);margin-right:8px;}
.draft-status{margin-top:7px;}
.filters{margin:20px 0 16px;gap:5px;}
.filters button{font-size:12px;min-height:30px;padding:5px 11px;border-radius:7px;}
.filters button.active{background:var(--soft);border-color:transparent;}
.filters .end{padding:5px;}
.card-grid{gap:16px;align-items:start;}
.card{border-radius:14px;transition:border-color .16s,box-shadow .16s;}
.card:hover{border-color:color-mix(in srgb,var(--muted) 36%,var(--border));box-shadow:0 3px 12px #23162b06;}
.card-top{padding:13px 15px 0;gap:7px;font-size:11px;}
.source-mark{width:22px;height:22px;border-radius:6px;background:var(--soft);}
.card-top .icon{width:14px;height:14px;}
.card-top time{font-size:10px;}
.card-body{padding:16px 18px 18px;min-height:110px;}
.card-body h3{font-size:16px;line-height:1.35;letter-spacing:-.02em;}
.card-body p{font-size:13px;line-height:1.55;-webkit-line-clamp:2;margin-top:10px;}
.card-preview{height:208px;margin:12px 12px 0;border-radius:8px;background:var(--soft);}
.card-media .card-body{min-height:0;padding:15px 18px;}
.card-footer{border-top:1px solid color-mix(in srgb,var(--border) 70%,transparent);padding:8px 15px;min-height:41px;}
.card-footer .tag{border:0;padding:2px 0;background:none;}
.card-footer .end{font-weight:550;color:var(--fg);}
.file-stack{margin:13px 14px 0;gap:5px;}
.file-line{padding:11px;border-radius:7px;}
.file-preview{margin:13px 14px 0;padding:20px 15px;}
.card-files .card-body{min-height:0;padding-top:14px;padding-bottom:15px;}
.card-files .card-body p{display:none;}
.card-links .card-body p{font-family:var(--font-mono);font-size:11px;overflow-wrap:anywhere;}
.is-minimized .card-body{min-height:0;padding:12px 18px;}
.task-row{border-width:0 0 1px;border-radius:0;background:transparent;padding:19px 2px;margin:0;align-items:center;gap:14px;}
.task-row:hover{background:color-mix(in srgb,var(--soft) 55%,transparent);}
.task-row h3{font-size:15px;line-height:1.4;letter-spacing:-.015em;}
.task-row .meta{font-size:11px;margin-top:6px;gap:6px;}
.task-row .time-estimate{color:var(--muted);}
.complete-control{width:21px;height:21px;border-radius:50%;border-color:color-mix(in srgb,var(--muted) 55%,var(--surface));}
.complete-control.done{background:color-mix(in srgb,var(--success) 8%,var(--surface));}
.tabs{gap:3px;padding:5px;background:var(--soft);border:0;border-radius:9px;margin-bottom:22px;width:fit-content;max-width:100%;}
.tabs a,.tabs button{border-radius:6px;padding:7px 13px;font-size:12px;}
.tabs .active{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px #23162b0c;}
.tabs:has(.grow){width:100%;background:transparent;border-bottom:1px solid var(--border);border-radius:0;padding:0 0 13px;}
.tabs:has(.grow) .active{background:var(--soft);box-shadow:none;}
.section-label{margin:22px 0 6px;font-size:10px;letter-spacing:.08em;}
.panel{border-radius:13px;padding:22px;}
.panel>h2{font-size:17px;margin-bottom:19px;}
.setting-row{padding:17px 0;}
.setting-row p{font-size:11px;line-height:1.5;max-width:37ch;}
.settings-layout{gap:18px;}
.footer{min-height:34px;padding:5px 23px;font-size:10px;color:var(--muted);}
.footer-menu{display:grid;place-items:center;width:28px;height:24px;border-radius:6px;}
.footer-menu .icon{width:18px;}
.detail-preview{border-radius:10px;min-height:230px;}
.detail-meta{font-size:11px;}
.details-actions{bottom:-28px;}
.note-paper{padding:6px 4px;}
.note-area{font-size:15px;line-height:1.85;}
.note-top h2{font-size:17px;}
.empty{padding:48px 16px;gap:11px;}
.empty h2{font-size:20px;}
.empty img{width:45px;height:55px;}
.modal{padding:24px;border-radius:18px;}
.modal h2{font-size:20px;}
.menu-list button,.menu-list a{padding:11px 10px;}
.notice{font-size:11px;line-height:1.6;}
/* The entry surface is a compact capture tool. Motion controls live in More. */
.buddy-frame{width:416px;height:min(684px,calc(100dvh - 40px));min-height:480px;margin:20px auto;padding:12px 0 12px;}
.buddy-frame .body-rim{background:var(--border);border-radius:24px;box-shadow:0 24px 64px #23162b1a,0 2px 5px #23162b09;}
.buddy-frame .app{border-radius:23px;}
.buddy-frame>.robot-head,.buddy-frame>.hands,.buddy-frame>.feet,.buddy-frame>.resize-handle{display:none;}
.buddy-frame .headbar{padding:20px 22px 10px;gap:6px;background:var(--bg);}
.buddy-frame .wordmark img{display:none;}
.buddy-frame .wordmark{font-size:22px;}
.buddy-frame .autostate{font-size:10px;gap:5px;}
.buddy-frame .head-spacer{min-width:24px;}
.buddy-frame .search-trigger,.buddy-frame .headbar>[data-action=add],.buddy-frame .expand-button,.buddy-frame .primary-nav{display:none;}
.buddy-frame .main{padding:0 24px;}
.buddy-frame .footer{border-top:0;background:var(--bg);padding:10px 24px 14px;}
.buddy-capture{display:flex;flex-direction:column;min-height:100%;}
.buddy-capture .robot-stage{min-height:248px;flex:1;display:flex;flex-direction:column;justify-content:center;gap:0;background:none;border:0;border-radius:0;overflow:visible;}
.buddy-robot{display:grid;place-items:center;position:relative;padding:0;width:114px;height:138px;border-radius:30px;transition:transform .2s;}
.buddy-robot:hover{background:transparent;transform:translateY(-4px);}
.buddy-robot:active{transform:translateY(1px) scale(.98);}
.buddy-capture .robot-stage img{width:112px;height:136px;filter:drop-shadow(0 9px 9px #44305414);}
.buddy-capture .robot-stage h1{font-size:28px;letter-spacing:-.035em;line-height:1.2;margin-top:8px;}
.buddy-capture .robot-stage .state-caption{position:static;font-size:12px;color:var(--muted);margin-top:7px;text-align:center;}
.buddy-capture .robot-stage .token{top:18px;z-index:2;}
.buddy-composer{display:block;padding:0;border-radius:14px;background:var(--surface);flex:none;margin-top:8px;}
.buddy-composer textarea{height:64px;min-height:64px;padding:15px 16px 6px;}
.buddy-composer .row{padding:0 10px 10px;}
.paste-button{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:6px 5px;border-radius:6px;}
.paste-button .icon{width:14px;height:14px;}
.buddy-composer .primary{margin-left:auto;}
.recent-capture{display:flex;align-items:center;gap:11px;margin:18px 0;padding:0 1px;min-height:42px;}
.recent-icon{display:grid;place-items:center;width:34px;height:38px;background:var(--soft);border-radius:8px;color:var(--muted);}
.recent-label{display:block;font-size:9px;letter-spacing:.09em;color:var(--muted);margin-bottom:3px;}
.recent-capture strong{display:block;max-width:245px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px;font-weight:500;}
.recent-capture>.icon{width:14px;color:var(--muted);}
.open-inbox{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-top:1px solid var(--border);font-size:13px;font-weight:550;}
.open-inbox>span{display:flex;align-items:center;gap:8px;}
.open-inbox>.icon{width:16px;}
.saved-reaction .buddy-robot{animation:happy .65s ease-in-out;}
.buddy-frame .drag-over:after{content:'Drop to save';inset:8px;}

/* Task hierarchy: check → title → time. Icon actions retain names and focus states. */
.task-card{container-type:inline-size;border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:16px;margin:0 0 12px;min-width:0;transition:border-color .18s,background .18s;}
.card-grid>.task-card{margin:0;align-self:stretch;display:flex;flex-direction:column;}
.task-card:hover{border-color:color-mix(in srgb,var(--muted) 50%,var(--border));}
.task-card-heading{display:flex;align-items:flex-start;gap:10px;}
.task-check{width:34px;height:38px;flex:none;display:grid;place-items:center;border-radius:8px;padding:0;}
.task-check>span{border:1.5px solid var(--muted);width:21px;height:21px;border-radius:6px;display:grid;place-items:center;transition:background .15s;}
.task-check .icon{width:15px;height:15px;}
.task-check[aria-pressed=true]>span{background:var(--fg);border-color:var(--fg);color:var(--surface);}
.task-card-title{flex:1;min-width:0;padding-top:1px;}
.task-kicker{display:block;color:var(--muted);font-size:10px;font-weight:550;line-height:1.4;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;}
.task-card-title h3{font-size:16px;line-height:1.45;letter-spacing:-.015em;overflow-wrap:anywhere;}
.task-card-heading>.icon-btn{color:var(--muted);width:28px;min-width:28px;height:30px;}
.task-card-context{display:flex;flex-wrap:wrap;gap:5px 14px;margin:9px 0 19px 44px;font-size:11px;color:var(--muted);}
.task-card-context:empty{margin-bottom:12px;}
.task-card-context>span{display:inline-flex;align-items:center;gap:5px;min-width:0;overflow-wrap:anywhere;}
.task-card-context .icon{width:12px;height:12px;}
.task-card-controls{display:flex;gap:9px;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:12px;margin-top:auto;}
.task-focus-control{display:flex;align-items:center;gap:2px;border:1px solid var(--border);border-radius:9px;background:var(--soft);padding:2px;min-width:0;}
.task-duration{display:flex;align-items:center;gap:7px;padding:5px 7px;font-size:12px;border-radius:6px;min-height:30px;white-space:nowrap;}
.task-duration .icon{width:15px;height:15px;color:var(--muted);}
.task-duration span{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.015em;}
.focus-play{display:grid;place-items:center;width:30px;height:30px;flex:none;background:var(--fg);color:var(--surface);border-radius:7px;}
.focus-play:hover{background:var(--fg);opacity:.8;}
.focus-play .icon{width:14px;height:14px;}
.task-focus-control[data-running=true]{border-color:var(--muted);}
.task-focus-control[data-running=true] .focus-play{background:var(--surface);color:var(--fg);}
.task-schedule{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-height:34px;border-radius:7px;padding:5px 7px;min-width:0;}
.task-schedule .icon{width:16px;height:16px;}
.task-schedule span{overflow-wrap:anywhere;}
.is-done .task-card-title h3{text-decoration:line-through;color:var(--muted);}
.is-done .task-card-controls{opacity:.7;}
.capture-project{display:flex;align-items:center;gap:6px;min-width:0;max-width:45%;}
.capture-project span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-footer{gap:3px;}
.card-footer .icon-btn{width:32px;height:32px;min-width:32px;border-radius:7px;display:grid;place-items:center;}
.card-footer .icon-btn .icon{width:17px;height:17px;}
.card-footer .capture-project .icon{width:14px;height:14px;}
.task-detail-top{display:flex;justify-content:space-between;align-items:center;margin:-8px 0 24px;}
.task-detail-top .back{margin:0;min-height:34px;}
.task-detail-top>.row{gap:4px;}
.task-editor{max-width:800px;margin:0 auto;}
.task-heading{display:flex;align-items:flex-start;gap:12px;}
.task-heading>.task-check{height:50px;margin-top:12px;}
.task-heading>.task-check>span{width:26px;height:26px;border-radius:7px;}
.task-title-input{border:0;background:transparent;border-radius:5px;font:600 clamp(21px,3cqi,28px)/1.35 var(--font-display);letter-spacing:-.025em;padding:0 0 5px;width:100%;resize:none;field-sizing:content;min-height:38px;}
.project-trigger{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;padding:6px 8px;font-size:12px;color:var(--muted);border-radius:7px;max-width:200px;}
.project-trigger .icon{width:14px;height:14px;}
.project-trigger span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.task-property-row{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:12px 0 26px 46px;}
.property-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:6px 9px;font-size:11px;max-width:100%;min-width:0;overflow-wrap:anywhere;}
.property-chip .icon{width:14px;height:14px;}
.priority-control{display:flex;gap:2px;}
.priority-control button{display:grid;place-items:center;width:30px;height:30px;border:1px solid transparent;border-radius:6px;color:var(--muted);}
.priority-control button[aria-pressed=true]{background:var(--soft);border-color:var(--muted);color:var(--fg);}
.priority-control .icon{width:14px;height:14px;}
.priority-bars{display:flex;align-items:flex-end;gap:2px;height:14px;}
.priority-bars i{display:block;width:3px;height:5px;background:var(--border);border-radius:1px;}
.priority-bars i:nth-child(2){height:9px;}.priority-bars i:nth-child(3){height:13px;}
.priority-bars .filled{background:currentColor;}
.task-planning-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;margin-bottom:28px;}

function recordManualPaste(id,value) {
  const x=item(id),app=trailIdentity(value);
  if(!x||x.deleted||!String(value||'').trim()||String(value).trim().length>100)return false;
  const receipt={id:'paste-'+(typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)),app:app.id==='unknown'?app.name:app.id,at:new Date().toISOString(),kind:'manual'};
  return change(()=>{if(!Array.isArray(x.pasteHistory))x.pasteHistory=[];x.pasteHistory.push(receipt)},false);
}
function removeManualPaste(id,receiptId) {
  const x=item(id);if(!x||!pasteReceipts(x).some(p=>p.id===receiptId&&p.kind==='manual'))return false;
  return change(()=>{x.pasteHistory=x.pasteHistory.filter(p=>p.id!==receiptId||p.kind!=='manual')},false);
}
function refreshTrailDialog(id) {
  closeDialog();render();
  document.querySelectorAll('[data-action="content-trail"]').forEach(el=>{if(el.dataset.id===id)el.focus()});
  trailDialog(item(id));
}
function commitManualPaste(id,value) {
  if(!recordManualPaste(id,value))return;
  refreshTrailDialog(id);toast('Paste destination recorded');
}
function handleTrailAction(a) {
  const action=a.dataset.action,id=a.dataset.id,x=item(id);
  if(!['content-trail','paste-picker','paste-record','paste-remove'].includes(action))return false;
  if(!x||x.deleted)return true;
  if(action==='content-trail'||action==='paste-picker') {
    if($('#detail-form'))detailDraft();
    trailDialog(x,action==='paste-picker');
  }else if(action==='paste-record')commitManualPaste(id,a.dataset.value);
  else if(removeManualPaste(id,a.dataset.value))refreshTrailDialog(id);
  return true;
}

function card(x){if(x.task)return taskCard(x);return `<article class="card card-${x.type.toLowerCase()} ${x.minimized?'is-minimized':''}" data-od-id="capture-${x.id}" data-capture="${x.id}"><div class="card-top">${contentTrail(x)}${x.pinned?ic('pin'):''}<time>${x.date===TODAY?x.time:dayLabel(x.date)}</time><button class="icon-btn" data-action="copy" data-id="${x.id}" aria-label="Copy ${esc(x.title)}">${ic('copy')}</button></div>${!x.minimized&&x.image?`<a class="card-preview" href="${taskRoute(x)}"><img src="${esc(x.image)}" alt="${esc(x.title)}"></a>`:''}${!x.minimized&&x.members?`<div class="file-stack">${x.members.map(id=>item(id)).filter(Boolean).map(f=>`<a href="${taskRoute(f)}" class="file-line">${ic('file')}<span>${esc(f.filename||f.title)}</span></a>`).join('')}</div>`:''}${!x.minimized&&x.type==='Files'&&!x.members?`<a href="${taskRoute(x)}" class="file-preview">${ic('file')}<div><strong>${esc(x.filename||x.title)}</strong><span>File</span></div></a>`:''}<a class="card-body" href="${taskRoute(x)}"><h3>${esc(x.title)}</h3>${!x.minimized&&!x.image&&!x.members?'<p dir="auto">'+esc(x.text)+'</p>':''}</a><div class="card-footer"><button type="button" class="capture-project" data-action="task-project" data-id="${x.id}" title="File to project" aria-label="File ${esc(x.title)} to a project">${ic('folder')}<span>${esc(x.project||'Unfiled')}</span></button><span class="end"></span>${x.reminder?'<a class="icon-btn" href="reminder.html?id='+x.id+'" aria-label="Edit reminder">'+ic('bell')+'</a>':''}${iconAction('taskbox','Turn into task','convert',x.id)}${x.inbox?iconAction('shelf','Keep in Workspace','keep',x.id):''}${iconAction('more','More actions for '+x.title,'card-menu',x.id)}</div></article>`}
function cards(xs){return xs.length?'<div class="card-grid">'+xs.map(card).join('')+'</div>':empty('Nothing in this view.','Try another filter, or save something new.')}

function inboxView(){const xs=projectItems().filter(x=>x.inbox&&!x.parent&&matches(x));return pageHead('Inbox','',projectSelect(),xs.length)+`<form id="quick-capture" class="composer" data-od-id="quick-capture"><label class="sr-only" for="quick-text">Quick capture</label><textarea id="quick-text" placeholder="Save a thought or link…" rows="1">${esc(state.drafts.inbox?.text||'')}</textarea><div class="row"><button type="button" class="icon-btn" data-action="import" aria-label="Import files">${ic('clip')}</button><a class="icon-btn" href="new-task.html" aria-label="New task" title="New task">${ic('taskbox')}</a><button type="button" class="icon-btn" data-action="paste" aria-label="Paste clipboard" title="Paste clipboard">${ic('copy')}</button><kbd class="capture-shortcut">⌘ ↵</kbd><button class="btn primary" type="submit">Save ${ic('arrow')}</button></div></form>${state.drafts.inbox?'<div class="meta draft-status">Draft restored</div>':''}${filters()}${cards(xs)}`}
function todayView(){const all=projectItems().filter(x=>x.task&&!x.parent),tab=state.todayTab;let xs=all.filter(x=>tab==='Completed'?x.completed:!x.completed&&(tab==='Upcoming'?x.planned>TODAY:x.planned===TODAY));xs.sort((a,b)=>(a.order??99)-(b.order??99));const unplanned=all.filter(x=>!x.planned&&!x.completed),unfinished=all.filter(x=>!x.completed&&x.planned&&x.planned<TODAY),rem=projectItems().filter(x=>!x.task&&x.reminder&&x.reminder.slice(0,10)<=TODAY);return pageHead('Today','',projectSelect(),dayLabel(TODAY))+`<div class="tabs">${['Today','Upcoming','Completed'].map(t=>`<button data-action="today-tab" data-value="${t}" class="${tab===t?'active':''}">${t}</button>`).join('')}<span class="grow"></span><a class="btn quiet" href="new-task.html">${ic('plus')} New task</a></div><div class="section-label"><span>${tab==='Today'?'Planned':tab}</span><span>${xs.length} tasks · ${durationLabel(xs.reduce((s,x)=>s+(Number(x.effort)||0),0))}</span></div>${xs.length?xs.map(taskRow).join(''):empty('Nothing planned here.','Choose a task from Inbox or create one when you’re ready.')}${tab==='Today'&&unfinished.length?'<div class="section-label">Still open</div>'+unfinished.map(taskRow).join(''):''}${tab==='Today'&&unplanned.length?'<div class="section-label">Unplanned</div>'+unplanned.map(taskRow).join(''):''}${tab==='Today'&&rem.length?'<div class="section-label">Reminders</div>'+rem.map(x=>`<div class="task-row">${ic('bell')}<a class="grow" href="${taskRoute(x)}">${esc(x.title)}</a>${button('Done','reminder-done','',x.id)}${button('Tomorrow','reminder-tomorrow','',x.id)}</div>`).join(''):''}`}
function workspaceView(){let xs=projectItems().filter(x=>!x.parent&&matches(x));if(PAGE==='shelf')xs=xs.filter(x=>x.shelf);if(PAGE==='clipboard')xs=xs.filter(x=>state.clipboardTab==='Snippets'?x.snippet:state.clipboardTab==='Pinned'?x.pinned:(x.origin==='clipboard'||['Text','Links'].includes(x.type)&&!x.task));return pageHead(titles[PAGE],PAGE==='shelf'?'The materials you want within reach.':PAGE==='clipboard'?'Find a good copy. Use it again.':'Everything you’ve kept, in one place.')+workspaceTabs()+`${PAGE==='clipboard'?`<div class="row"><div class="tabs" style="border:0;margin:0;padding:0">${['Recent','Pinned','Snippets'].map(t=>`<button data-action="clipboard-tab" data-value="${t}" class="${state.clipboardTab===t?'active':''}">${t}</button>`).join('')}</div></div>`:''}${PAGE==='shelf'?`<div class="row between"><span class="meta">${xs.length} items in this view</span><div class="row">${button(ic('plus')+' Add from Library','shelf-add')}${button(ic('download')+' Export shelf','shelf-export')}</div></div>`:''}${filters()}${cards(xs)}`}
function notesView(){let key=state.project==='all'?'unfiled':state.project,n=state.notes[key]||{text:''};return pageHead('Notes','A scratchpad for the project on your mind.')+workspaceTabs()+`<div class="note-paper" data-od-id="scratchpad"><div class="note-top row between"><h2>${key==='unfiled'?'Unfiled notes':esc(key)}</h2><span class="meta" id="note-status">${ic('check')} Saved</span></div><label class="sr-only" for="scratchpad">Project scratchpad</label><textarea class="note-area" id="scratchpad" placeholder="Start writing…">${esc(n.text)}</textarea><div class="row between rule"></div><div class="row between wrap"><span class="meta">Your scratchpad stays here after saving.</span><div class="row">${button('Save as note','note-convert')}${button('Make task','note-task','primary')}</div></div></div>`}

xs=xs.filter(x=>x.date===state.date).sort((a,b)=>b.time.localeCompare(a.time));let groups={};xs.filter(x=>x.auto&&!x.task).forEach(x=>(groups[x.time.slice(0,2)]??=[]).push(x));let grouped=new Set(),content='';Object.entries(groups).forEach(([hour,g])=>{if(g.length>=4){g.forEach(x=>grouped.add(x.id));content+=`<details class="hour-group" data-od-id="hour-${hour}"><summary aria-label="Expand or collapse ${g.length} automatic actions">${ic('history')}<strong>${hour}:00–${hour}:59</strong><span>${g.length} saved actions</span><span class="grow"></span><span title="Collapse actions">${ic('minus')}</span></summary><div class="card-grid">${g.map(card).join('')}</div></details>`}});const carry=projectItems().filter(x=>x.task&&!x.completed&&x.date<state.date&&(!x.reminder||x.reminder.slice(0,10)<=state.date)&&matches(x));return dateHeader()+filters()+`<div class="section-label"><span>${fullDay(state.date)}</span><span>${xs.length} captures</span></div>${carry.length?'<div class="section-label">Still open · original capture date preserved</div>'+carry.map(x=>`<div class="meta">Captured ${dayLabel(x.date)}</div>${taskRow(x)}`).join(''):''}${cards(xs.filter(x=>!grouped.has(x.id)))}${content}`}

function searchResults(){let q=state.query.trim().toLocaleLowerCase(),words=q.split(/\s+/).filter(Boolean),start=state.scope==='Week'?dayAdd(state.date,-6):state.date;const inScope=d=>state.scope==='All'||d>=start&&d<=state.date;let xs=projectItems().filter(x=>matches(x)&&inScope(x.date)&&words.every(w=>[x.title,x.text,x.indexed,x.filename,x.snippet,x.project].join(' ').toLocaleLowerCase().includes(w)));let ns=state.source==='all'&&['All','Text'].includes(state.filter)?Object.entries(state.notes).filter(([p,n])=>(state.project==='all'||state.project===p)&&inScope(n.updated)&&words.every(w=>n.text.toLocaleLowerCase().includes(w))):[];$('#search-results').innerHTML=`<div class="section-label"><span>${xs.length+ns.length} results${state.scope!=='All'?' · '+state.scope.toLowerCase()+' ending '+dayLabel(state.date):''}</span><span>Local text search</span></div>${!xs.length&&!ns.length?`<div class="empty"><h2>No matches yet.</h2><p>Keep your search and try a wider view.</p><div class="row">${button('Clear refinements','clear-refinements')}${button('Search all dates','all-dates')}</div></div>`:xs.map(x=>`<a class="search-result" href="${taskRoute(x)}">${ic(x.type==='Media'?'image':x.type==='Links'?'link':'text')}<div><span class="meta">${esc(x.source||'Source unavailable')} · ${dayLabel(x.date)}${x.snippet?' · Snippet: '+esc(x.snippet):''}</span><h3>${esc(x.title)}</h3><p dir="auto">${esc((x.indexed||x.text||'No text preview').slice(0,220))}</p>${x.indexed?'<span class="meta">Recognized text</span>':''}</div></a>`).join('')+ns.map(([p,n])=>`<a class="search-result" href="notes.html?project=${encodeURIComponent(p)}">${ic('note')}<div><span class="meta">Scratchpad · updated ${dayLabel(n.updated)}</span><h3>${esc(p==='unfiled'?'Unfiled notes':p)}</h3><p>${esc(n.text.slice(0,200))}</p></div></a>`).join('')}${state.nearby&&xs.length?'<div class="section-label">Nearby context · not search matches</div>'+projectItems().filter(x=>xs.some(y=>y.date===x.date)&&!xs.some(y=>y.id===x.i function projectNameError(name){if(!name)return 'Enter a project name.';if(name.length>180)return 'Keep the name under 180 characters.';if(['all','all projects','unfiled','__new'].includes(name.toLocaleLowerCase())||state.projects.some(p=>p.toLocaleLowerCase()===name.toLocaleLowerCase()))return 'That name is already in use.';return ''}

/* Geometry helpers are shared by dragging, resizing and anchored project UI. */
function viewportRect(){const v=window.visualViewport;return {left:v?.offsetLeft||0,top:v?.offsetTop||0,width:v?.width||window.innerWidth,height:v?.height||window.innerHeight}}
function fitWindowRect(rect,viewport){
 const width=Math.min(Math.max(1,rect.width),viewport.width),height=Math.min(Math.max(1,rect.height),viewport.height);
 return {width,height,left:Math.max(viewport.left,Math.min(rect.left,viewport.left+viewport.width-width)),top:Math.max(viewport.top,Math.min(rect.top,viewport.top+viewport.height-height))};
}
function projectPanelRect(anchor,size,viewport){
 const gap=12,width=Math.min(size.width,viewport.width-gap*2),height=Math.min(size.height,viewport.height-gap*2);
 const bottom=viewport.top+viewport.height-gap,above=anchor.top-height-8;
 const top=anchor.bottom+8+height<=bottom?anchor.bottom+8:above>=viewport.top+gap?above:bottom-height;
 return {width,height,left:Math.max(viewport.left+gap,Math.min(anchor.left,viewport.left+viewport.width-width-gap)),top:Math.max(viewport.top+gap,top)};
}
function setFrameRect(frame,rect){Object.assign(frame.style,{position:'fixed',margin:'0',left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px'})}
function keepFrameInViewport(){
 const frame=$('#frame');if(!frame||!frame.getAttribute('style'))return;
 setFrameRect(frame,fitWindowRect(frame.getBoundingClientRect(),viewportRect()));
}

let frameRestoreStyle=null;
function toggleFrameExpansion(){const frame=$('#frame');if(!frame)return;
 if(frame.classList.contains('expanded')){frame.classList.remove('expanded');if(frameRestoreStyle)frame.setAttribute('style',frameRestoreStyle);else frame.removeAttribute('style');keepFrameInViewport()}
 else{frameRestoreStyle=frame.getAttribute('style');frame.removeAttribute('style');frame.classList.add('expanded')}
 positionProjectSwitcher();
}

  if(x.focus?.endAt)return Math.max(0,Math.ceil((x.focus.endAt-now)/1000));

function updateTaskTimers(){
  const ended=alive().filter(x=>x.focus?.endAt&&x.focus.endAt<=Date.now());
  if(ended.length&&change(()=>ended.forEach(x=>x.focus={remaining:0}),false))toast(ended.length===1?'Timer finished · '+ended[0].title:'Focus timers finished');
  $$('[data-timer-clock]').forEach(n=>{const x=item(n.dataset.timerClock);if(!x)return;n.textContent=n.closest('.focus-panel')||x.focus?focusClock(x):x.effort?String(Math.floor(x.effort/60)).padStart(2,'0')+'h '+String(x.effort%60).padStart(2,'0')+'m':'Set timer'});

async function handleTaskAction(a){const act=a.dataset.action,id=a.dataset.id||currentId,val=a.dataset.value;
  switch(act){
    case 'project-picker':openProjectSwitcher(a);return true;
    case 'project-pick':if(change(()=>state.project=val,false)){closeDialog();render()}return true;
    case 'project-new':closeDialog();askName('New project','','new-project-save');return true;
    case 'task-duration':openTaskDuration(id);return true;
    case 'task-schedule':openTaskSchedule(id);return true;
    case 'timer-toggle':toggleFocus(id);return true;
    case 'timer-reset':if(change(()=>{delete item(id).focus},false))updateTaskTimers();return true;
    case 'duration-preset':{const f=a.closest('form');f.elements.hours.value=Math.floor(Number(val)/60);f.elements.minutes.value=Number(val)%60;f.dispatchEvent(new Event('input',{bubbles:true}));return true}
    case 'schedule-preset':a.closest('form').elements.planned.value=val;return true;
    case 'task-quick-day':case 'task-clear-schedule':{if(updateTaskPlan(id,{planned:act==='task-clear-schedule'?null:val,scheduledTime:act==='task-clear-schedule'?null:item(id).scheduledTime})){refreshTaskUI(id);toast(act==='task-clear-schedule'?'Schedule cleared':'Scheduled')}return true}
    case 'task-project':chooseTaskProject(id);return true;
    case 'task-project-select':if(updateTaskPlan(id,{project:val||null})){refreshTaskUI(id);toast('Project saved')}return true;
    case 'task-priority':case 'task-repeat':{const f=$('#detail-form'),field=act==='task-priority'?'priority':'repeat';f.elements[field].value=val;a.parentElement.querySelectorAll('button').forEach(n=>n.setAttribute('aria-pressed',String(n===a)));detailDraft();return true}
    case 'undo-task-conversion':{if(!convertedSnapshot)return true;const {id:convertedId,snapshot}=convertedSnapshot;if(change(()=>{const x=item(convertedId);taskFields.forEach(k=>{if(snapshot[k]===undefined)delete x[k];else x[k]=snapshot[k]})})){convertedSnapshot=null;toast('Capture restored')}return true}
  }
  return false;
}
function submitTaskTiming(e){const f=e.target;if(!['task-duration-form','task-schedule-form'].includes(f.id))return;e.preventDefault();const id=taskEditor.id;
  if(f.id==='task-duration-form'){
    const h=Number(f.elements.hours.value),m=Number(f.elements.minutes.value),total=h*60+m;
    if(!Number.isInteger(h)||!Number.isInteger(m)||h<0||m<0||m>59||total<=0||total>10080){toast('Choose 1 minute to 168 hours.',true);return}
    const startAfter=taskEditor.startAfter,patch={effort:total,focus:startAfter?{remaining:total*60,endAt:Date.now()+total*60000}:undefined};
    if(updateTaskPlan(id,patch)){refreshTaskUI(id);toast(startAfter?'Timer started':'Timer set')}
  }else if(f.elements.planned.value){if(updateTaskPlan(id,{planned:f.elements.planned.value,scheduledTime:f.elements.scheduledTime.value||null})){refreshTaskUI(id);toast('Task scheduled')}}
}

'choose-folder':['Choose screenshot folder','The native folder picker stores a security-scoped bookmark. Cancel preserves the old folder; authorization failure exposes Choose again. Enabling starts a fresh baseline and never imports old images. Clipboard capture remains independent. No folder access is granted by this browser simulation.'],
'capture-status':['Capture source status','Each source has Off, Active, Paused, Excluded, Permission needed/revoked and Failed states. Pause immediately stops new intake, retains existing records, and resumes with a fresh baseline. Only persisted successful actions may trigger robot confirmation.'],
'shortcut-status':['Global shortcut registration','Native choices are the two displayed combinations or Disabled. A registration conflict shows the conflicting combination, offers the alternate, and retains the previous working registration. DaBin does not monitor general typing. Browser keyboard shortcuts operate only while this document is focused.'],
'archive':['Local archive','Open the native archive folder: year → numbered named month → numbered named day with weekday → unique capture folder. Core Data metadata is authoritative. Managed imports are copies; source originals are unchanged. Missing folder or access errors offer Retry without creating an alternate archive.'],
'rebuild-index':['Rebuild local text index','Native sequence: confirm scope → queued/progress → complete with indexed/failed counts. Retry failed originals individually. Save and capture remain available with bounded indexing concurrency. Cancel stops queued work and retains existing searchable text.'],
'updates':['Get updates · direct build','Installed baseline: 0.4.2 (53). A user-initiated check may return current, available, unavailable or failed. Available releases show release details before download; verify the package, back up, then install. Verification or backup failure blocks installation. No release availability has been checked here.'],
'store-updates':['Updates · App Store build','Show installed version and “Managed by the App Store”. Open the App Store application page only when its configured destination is available. The direct downloader and update helper are excluded from this build. This prototype does not assert App Store availability.'],
'privacy':['Private by design','Native DaBin stores captures and recognized text locally. No account, analytics, ads, cloud sync or remote OCR. Manual link previews and explicit update checks are disclosed network requests. Source attribution and sensitive-app exclusion are best effort. DaBin does not automatically observe where content is later pasted. The content trail stores destinations you explicitly record; copying alone never records a paste.'],
'support':['Support','Native Settings opens the configured support and privacy destinations from PrivacyInformation.swift. No support message is sent from this prototype. Include version, reproduction steps and a redacted diagnostic description; never attach live clipboard content automatically.'],
'export-spec':['Native export states','Copy and Save Text use the identical UTF-8 payload. Save panel cancellation is neutral. Clipboard failure retains the existing clipboard; disk failure retains the payload and offers Retry or Copy. An empty scope disables both actions. Exports ignore type filters and carried-task duplicates.'],
'backup-states':['Native verified backup','Idle → local destination picker → busy progress → checksum verification → verified success. Cancel leaves no accepted partial package. Unavailable destination, interrupted write or corrupt manifest shows a specific error and preserves the working archive. Pending unsaved edits must save before backup starts.'],
'backup-conflicts':['Native additive restore','Read and verify every entry before mutation. Identical records are skipped; new records are added. Conflicting capture or scratchpad content blocks restore for review without overwriting authored work. A corrupt or unavailable package cannot be partially applied. The recovery journal retains a stable pre-operation state.'],
'placement-states':['Native robot placement','Resting is hidden. Entering the chosen corner or compatible island reveals a stable intake target on the interacted display. A display change clamps to its safe area; missing island or external display falls back to top right. Opening wins over capture animations. Decorative parts never intercept content clicks, change Spaces or steal focus.']};

function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let i=0;i<8;i++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0}
async function exportShelf(){const xs=projectItems().filter(x=>x.shelf),enc=new TextEncoder();if(!xs.length){toast('This project shelf is empty.',true);return}try{let parts=[],central=[],offset=0,used=new Set();for(const x of xs){let filename=x.filename||x.title+'.txt',bytes;if(x.data){bytes=new Uint8Array(await(await fetch(x.data)).arrayBuffer())}else if(x.image||x.url&&x.url.startsWith(ASSETS)){const r=await fetch(x.image||x.url);if(!r.ok)throw Error('Missing managed file: '+x.title);bytes=new Uint8Array(await r.arrayBuffer())}else bytes=enc.encode(x.text||x.url||x.title);filename=filename.replace(/[\/\\:*?"<>|]/g,'_');if(used.has(filename))filename=x.id+'-'+filename;used.add(filename);let name=enc.encode(filename),crc=crc32(bytes),head=new Uint8Array(30+name.length),v=new DataView(head.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint32(14,crc,true);v.setUint32(18,bytes.length,true);v.setUint32(22,bytes.length,true);v.setUint16(26,name.length,true);head.set(name,30);parts.push(head,bytes);let dir=new Uint8Array(46+name.length),d=new DataView(dir.buffer);d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x800,true);d.setUint32(16,crc,true);d.setUint32(20,bytes.length,true);d.setUint32(24,bytes.length,true);d.setUint16(28,name.length,true);d.setUint32(42,offset,true);dir.set(name,46);central.push(dir);offset+=head.length+bytes.length}const size=central.reduce((s,x)=>s+x.length,0),end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,xs.length,true);v.setUint16(10,xs.length,true);v.setUint32(12,size,true);v.setUint32(16,offset,true);let blob=new Blob([...parts,...central,end],{type:'application/zip'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='DaBin-Shelf-'+(state.project==='all'?'All-projects':state.project.replace(/[\/\\]/g,'-'))+'.zip';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('Complete project shelf ZIP prepared · '+xs.length+' items')}catch(err){toast('Shelf export failed: '+err.message,true)}}
